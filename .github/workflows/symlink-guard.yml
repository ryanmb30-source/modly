# Runs the one test that cannot execute on a stock Windows workstation.
#
# electron/main/extension-install-recovery.test.mjs asserts that extension
# registration state is never written through, and backup cleanup never deletes
# through, a symlinked backup directory. Setting that scenario up requires
# creating a symlink, which Windows refuses without Developer Mode or elevation,
# so the test self-skips locally via a capability probe.
#
# Linux has no such restriction. Running it here keeps the guard verified
# without granting SeCreateSymbolicLink on a workstation.
name: symlink guard

on:
  push:
    branches:
      - modly-fork
  workflow_dispatch:

jobs:
  symlink-backup-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm install, not npm ci: the committed package-lock.json is out of sync
      # with package.json upstream, so `npm ci` fails on a missing-from-lock
      # error. The repo's own ci.yml uses npm install for the same reason.
      - name: Install dependencies
        run: npm install

      # --test-reporter=tap is pinned deliberately: node 20 defaults to TAP and
      # node 24 to spec, and the two disagree on how pattern-filtered tests are
      # counted, so aggregate pass/skip totals are not portable.
      - name: Run the symlinked-backup guard test
        run: |
          set -o pipefail
          node --test \
            --test-reporter=tap \
            --test-name-pattern="never writes through a symlinked backup" \
            electron/main/extension-install-recovery.test.mjs 2>&1 | tee result.txt

      # The test skips itself when symlinks are unavailable, and node exits 0 on
      # a skip. Without this step a runner that could not create symlinks would
      # report green while proving nothing. Assert on the test's own TAP line
      # rather than aggregate counts, which vary by node version.
      - name: Assert the test actually ran
        run: |
          NAME='registration transaction state never writes through a symlinked backup'
          LINE=$(grep -E "^(ok|not ok) [0-9]+ - $NAME" result.txt || true)
          echo "TAP line: ${LINE:-<none>}"

          if [ -z "$LINE" ]; then
            echo "::error::Guard test not found in output - did the name change?"
            cat result.txt
            exit 1
          fi

          case "$LINE" in
            'not ok'*)
              echo "::error::Guard test FAILED - a symlinked backup was written or deleted through."
              cat result.txt
              exit 1
              ;;
          esac

          if printf '%s' "$LINE" | grep -q '# SKIP'; then
            echo "::error::Guard test was SKIPPED on the runner, so this job proves nothing."
            cat result.txt
            exit 1
          fi

          echo "Symlinked-backup guard ran and passed."
